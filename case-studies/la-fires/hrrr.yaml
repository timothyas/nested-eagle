mover:
  name: mpidatamover

directories:
  zarr:  ${SCRATCH}/nested-eagle/case-studies/la-fires/hrrr.forecasts.zarr
  cache: ${SCRATCH}/nested-eagle/case-studies/la-fires/cache/hrrr
  logs:  ${SCRATCH}/nested-eagle/case-studies/la-fires/logs/hrrr

source:
  name: aws_hrrr_archive
  t0:
    start: 2025-01-05T12
    end: 2025-01-07T12
    freq: 24h

  fhr:
    start: 0
    end: 48
    step: 6

  variables:
    # 3D Prognostic
    - gh
    - u
    - v
    - t
    - q
    # 2D Prognostic
    - sp
    - u10
    - v10
    - t2m
    - sh2
    # extra
    - mslma
    - orog

  levels:
    - 250
    - 500
    - 850

transforms:
  rotate_vectors:
    vector_pairs:
      - ["u", "v"]
      - ["u10", "v10"]

  horizontal_regrid:
    target_grid_path: ${SCRATCH}/nested-eagle/0.25deg-06km/data/hrrr_06km.nc
    regridder_kwargs:
      method: conservative
      reuse_weights: True
      filename: ${SCRATCH}/nested-eagle/0.25deg-06km/data/conservative_weights_hrrr.nc

target:
  name: base
  chunks:
    t0: 1
    fhr: 1
    level: -1
    y: -1
    x: -1
