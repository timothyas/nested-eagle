forecast_path: ${SCRATCH}/nested-eagle/0.25deg-06km/baselines/gfs-forecasts-vs-gfs-analysis/gfs.forecasts.zarr
output_path:   ${PWD}/gfs-no-contours
from_anemoi: false
lead_time: 360
start_date: 2023-03-09T12
end_date: 2023-03-09T12

verification_dataset_kwargs:
  dataset: /pscratch/sd/t/timothys/nested-eagle/0.25deg-06km/data/gfs.zarr

model_type: global
target_name: "GFS 0.25deg fhr00"
model_name: "GFS 0.25deg"
vars_of_interest:
  - t2m
  - 10m_wind_speed

fig_kwargs:
  width: 10
  height: 7
  projection: Orthographic
  projection_kwargs:
    central_longitude: -120
    central_latitude: 20
  cartopy_features:
    coastlines:
      resolution: "50m"
      color: darkgray
      linewidth: 0.3
    borders:
      edgecolor: darkgray
      linewidth: 0.3


per_variable_kwargs:
  2m_temperature:
    vmin: -15
    vmax: 30
  10m_wind_speed:
    vmin: 0
    vmax: 18
