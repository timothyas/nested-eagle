  - 10m_wind_speed
  - t2m

fig_kwargs:
  width: 10
  height: 7
  projection: Orthographic
  projection_kwargs:
    central_longitude: -120
    central_latitude: 20
  lam_size: 0.01
  global_size: 0.25
  box_kwargs:
    color: lightgray
  cartopy_features:
    coastlines:
      resolution: "50m"
      color: darkgray
      linewidth: 0.3
    borders:
      edgecolor: darkgray
      linewidth: 0.3
    states:
      edgecolor: darkgray
      linewidth: 0.3

