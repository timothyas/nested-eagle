forecast_path: ${SCRATCH}/nested-eagle/0.25deg-06km/baselines/gfs-forecasts-vs-gfs-analysis/gfs.forecasts.zarr
output_path:   ${SCRATCH}/nested-eagle/0.25deg-06km/baselines/gfs-forecasts-vs-gfs-analysis/figures
from_anemoi: false
lead_time: 360
start_date: 2023-03-08T06
end_date: 2023-03-09T06

verification_dataset_kwargs:
  dataset: /pscratch/sd/t/timothys/nested-eagle/0.25deg-06km/data/gfs.zarr

model_type: global
target_name: "GFS fhr00"
model_name: "GFS 0.25deg"
vars_of_interest:
  - 10m_wind_speed

levels:
  - 500
  - 850

fig_kwargs:
  width: 10
  height: 7
  projection: Orthographic
  projection_kwargs:
    central_longitude: -120
    central_latitude: 20
  cartopy_features:
    borders:
      edgecolor: gray
      linewidth: 0.5
    states:
      edgecolor: gray
      linewidth: 0.3
    coastlines:
      edgecolor: black
      linewidth: 0.3

contours:
  variable: gh
  level: 850
  levels: 12
  colors: black
  linewidths: 0.6

per_variable_kwargs:
  t:
    vmin: -20
    vmax: 20
