mover:
  name: mpidatamover

directories:
  zarr: ${SCRATCH}/nested-eagle/0.25deg-06km/data/gfs.as.hrrr.zarr
  cache: ${SCRATCH}/nested-eagle/0.25deg-06km/data/gfs-as-hrrr/cache
  logs: ${SCRATCH}/nested-eagle/0.25deg-06km/data/gfs-as-hrrr/logs

multisource:

  # Analysis data
  - source:
      name: gfs_archive
      t0:
        start: 2023-02-01T06
        end: 2025-02-15T18
        freq: 6h

      fhr:
        start: 0
        end: 0
        step: 6

      variables:
        # 3D Prognostic
        - gh
        - u
        - v
        - w
        - t
        - q
        # 2D Prognostic
        - sp
        - u10
        - v10
        - t2m
        - t_surface
        - sh2
        # Diagnostic
        - u80
        - v80
        # Forcing
        - lsm
        - orog

      levels:
        - 100
        - 150
        - 200
        - 250
        - 300
        - 400
        - 500
        - 600
        - 700
        - 850
        - 925
        - 1000

      slices:
        sel:
          latitude: [89.9, -89.9]

  # Forecast data
  - source:
      name: gfs_archive
      t0:
        start: 2023-02-01T00
        end: 2025-02-15T12
        freq: 6h

      fhr:
        start: 6
        end: 6
        step: 6

      variables:
        # Diagnostic
        - accum_tp
      slices:
        sel:
          latitude: [89.9, -89.9]

transforms:
  horizontal_regrid:
    target_grid_path: ${SCRATCH}/nested-eagle/0.25deg-06km/data/hrrr_06km.nc
    regridder_kwargs:
      method: conservative
      reuse_weights: True
      filename: ${SCRATCH}/nested-eagle/0.25deg-06km/data/weights_gfs_as_hrrr.nc

target:
  name: anemoi
  sort_channels_by_levels: True
  compute_temporal_residual_statistics: False
  transformed_dims:
    latitude: y
    longitude: x
  forcings:
    - cos_latitude
    - sin_latitude
    - cos_longitude
    - sin_longitude
    - cos_julian_day
    - sin_julian_day
    - cos_local_time
    - sin_local_time
    - insolation

  chunks:
    time: 1
    variable: -1
    ensemble: 1
    cell: -1
